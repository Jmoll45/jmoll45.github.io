<!DOCTYPE html>

    <title>30 Image Gallery</title>
    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 2rem;
        }

.gallery {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 15px;
    padding: 20px;
}

.image-card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

.image-card img {
    width: 100%;
    height: 240px; /* Adjust image height */
    object-fit: cover;
}

.caption {
    padding: 8px;
    font-size: 14px;
    text-align: center;
}
    </style>
</head>
